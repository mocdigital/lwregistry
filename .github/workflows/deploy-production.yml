name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: lwregistry-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_KNOWN_HOSTS: ${{ secrets.LIVE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIVE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$LIVE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy the pushed commit
        env:
          LIVE_HOST: ${{ secrets.LIVE_HOST }}
          LIVE_USER: ${{ secrets.LIVE_USER }}
          LIVE_PORT: ${{ secrets.LIVE_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$LIVE_PORT" \
            -o StrictHostKeyChecking=yes \
            "$LIVE_USER@$LIVE_HOST" \
            "/home/lwreg/bin/deploy-lwregistry '$DEPLOY_SHA'"
