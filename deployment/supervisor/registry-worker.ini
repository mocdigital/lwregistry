[program:registry-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/registry/artisan queue:work database --queue=auth,mail,default --sleep=3 --tries=3 --timeout=300 --max-time=3600
directory=/var/www/registry
user=registry
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/var/log/supervisor/registry-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
