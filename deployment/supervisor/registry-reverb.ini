[program:registry-reverb]
process_name=%(program_name)s
command=/usr/bin/php /var/www/registry/artisan reverb:start --host=127.0.0.1 --port=8080 --no-interaction
directory=/var/www/registry
user=registry
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/supervisor/registry-reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
