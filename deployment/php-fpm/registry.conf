[registry]
user = registry
group = registry

listen = /run/php-fpm/registry.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

chdir = /var/www/registry
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /var/log/php-fpm/registry-error.log
php_admin_flag[log_errors] = on
php_value[session.save_path] = /var/lib/php/session
php_value[upload_max_filesize] = 20M
php_value[post_max_size] = 20M
